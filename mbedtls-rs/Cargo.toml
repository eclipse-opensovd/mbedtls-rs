[package]
name = "mbedtls-rs"
version.workspace = true
edition.workspace = true
description = "Safe Rust wrapper for mbedtls 4.0.0 with async (Tokio) support"
license.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = ["tokio", "multithread"]
tokio = ["dep:tokio"]
# Thread-safe mbedtls build. Enables MBEDTLS_THREADING_C in the C library and
# the Send/Sync impls on wrapper types. Without this feature the underlying
# library has unguarded global state (PSA core), so all mbedtls usage must stay
# on a single thread.
multithread = ["mbedtls-sys/multithread"]

[dependencies]
ed25519-dalek = "2"
mbedtls-sys = { workspace = true }
tokio = { version = "1", features = [
  "io-util",
  "net",
  "rt",
  "macros",
], optional = true }
tracing = "0.1.41"

[dev-dependencies]
hex = "0.4"
