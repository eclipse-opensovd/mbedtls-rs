name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  cargo:
    name: Cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

  rust_quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Format and Clippy - Nightly toolchain pinned
        uses: eclipse-opensovd/cicd-workflows/rust-lint-and-format-action@07140bdd84f20b66fd4aff58a83c5148deec388c
        with:
          toolchain: nightly-2025-07-14
          github-token: ${{ secrets.GITHUB_TOKEN }}
          clippy-features: ""
          fail-on-format-error: "true"
          fail-on-clippy-error: "true"
          clippy-deny-warnings: "true"
          error-on-unformatted: "true"
          reporter: github-check

  bazel:
    name: Bazel (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel repository and build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Cargo.lock') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Build
        run: bazel build //:mbedtls_rs

      - name: Query targets
        run: bazel query //...

  bindings:
    name: Verify generated bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang libclang-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Install nightly rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-07-14
          components: rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Regenerate bindings
        run: scripts/regenerate-bindings.sh

      - name: Verify bindings are unchanged
        run: git diff --exit-code -- mbedtls-sys/src/bindings.rs

  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18.9

      - name: Check dependency advisories
        run: cargo deny check advisories

      - name: Check dependency licenses
        run: cargo deny check licenses

      - name: Check dependency sources
        run: cargo deny check sources

      - name: Check dependency bans
        run: cargo deny check bans
