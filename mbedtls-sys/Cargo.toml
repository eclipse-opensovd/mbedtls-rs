[package]
name = "mbedtls-sys"
version.workspace = true
edition.workspace = true
description = "Raw FFI bindings to mbedtls 4.0.0, generated by bindgen"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

# Intentionally empty: opts out of workspace pedantic lints.
# Generated bindings.rs uses non-Rust naming conventions.
[lints]

[features]
# Enable to regenerate src/bindings.rs from vendor/ mbedtls headers.
# Requires clang to be installed. Run via scripts/regenerate-bindings.sh.
generate-bindings = ["dep:bindgen"]
# Build mbedtls with MBEDTLS_THREADING_C so the library is safe to use from
# multiple threads (pthread on Unix, SRWLOCK-based MBEDTLS_THREADING_ALT on Windows).
multithread = []

[dependencies]

[build-dependencies]
cc = "1"
cmake = "0.1"
bindgen = { version = "0.72", optional = true }
